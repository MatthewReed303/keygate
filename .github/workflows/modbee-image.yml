name: ModBee image

# The image ModBee's licence server runs: the `modbee` branch (upstream Keygate with the offline plans, device tokens
# and evaluation plans merged), checked by CI, then pushed to this repository's GitHub Container Registry as
#   ghcr.io/<owner>/keygate:modbee           the latest build of the branch
#   ghcr.io/<owner>/keygate:modbee-<commit>  one build, to pin or roll back to
on:
  push:
    branches: [modbee]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    name: Build and push
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Names
        id: names
        run: |
          {
            echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "COMMIT=${GITHUB_SHA::7}"
            echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=modbee-${{ steps.names.outputs.COMMIT }}
            COMMIT=${{ steps.names.outputs.COMMIT }}
            BUILD_DATE=${{ steps.names.outputs.BUILD_DATE }}
          tags: |
            ${{ steps.names.outputs.IMAGE }}:modbee
            ${{ steps.names.outputs.IMAGE }}:modbee-${{ steps.names.outputs.COMMIT }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
